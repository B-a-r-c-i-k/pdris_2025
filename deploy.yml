---
- name: Deploy mymath application
  hosts: myservers
  become: yes

  vars:
    app_name: mymath
    app_version: 1.0.0
    archive_name: "{{ app_name }}-{{ app_version }}.tar"
    deploy_dir: /opt/{{ app_name }}

  tasks:
    - name: Create deploy directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy application archive to remote host
      copy:
        src: "{{ archive_name }}"
        dest: /tmp/{{ archive_name }}
        mode: '0644'

    - name: Extract application archive
      unarchive:
        src: /tmp/build
        dest: "{{ deploy_dir }}"
        remote_src: yes

    - name: Set permissions on application files
      file:
        path: "{{ deploy_dir }}"
        recurse: yes
        owner: root
        group: root
        mode: '0755'
